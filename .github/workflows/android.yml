name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TOK-Android.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TOK-Android
          path: TOK-Android.apk
          retention-days: 30
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v1.2.${{ github.run_number }}"
          gh release create "$TAG" TOK-Android.apk \
            --title "ТОК Android v1.2.${{ github.run_number }}" \
            --notes "Обновлённая сборка Android-приложения ТОК: pull-to-refresh и новый launcher icon." \
            --latest

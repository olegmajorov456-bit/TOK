name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/app/**'
      - 'android/build.gradle'
      - 'android/settings.gradle'
      - 'android/gradle.properties'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Build web app
        run: |
          npm ci
          npm run build
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set build version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.7.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Configure stable release signing
        env:
          TOK_ANDROID_KEYSTORE_BASE64: ${{ secrets.TOK_ANDROID_KEYSTORE_BASE64 }}
          TOK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TOK_ANDROID_KEYSTORE_PASSWORD }}
          TOK_ANDROID_KEY_ALIAS: ${{ secrets.TOK_ANDROID_KEY_ALIAS }}
          TOK_ANDROID_KEY_PASSWORD: ${{ secrets.TOK_ANDROID_KEY_PASSWORD }}
        run: |
          for secret_name in TOK_ANDROID_KEYSTORE_BASE64 TOK_ANDROID_KEYSTORE_PASSWORD TOK_ANDROID_KEY_ALIAS TOK_ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Add the GitHub Actions secret $secret_name before building a signed APK."
              exit 1
            fi
          done
          printf '%s' "$TOK_ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/tok-release.jks
          test -s android/app/tok-release.jks || { echo "::error::The Android signing keystore is empty or invalid."; exit 1; }
      - name: Build signed APK
        env:
          TOK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TOK_ANDROID_KEYSTORE_PASSWORD }}
          TOK_ANDROID_KEY_ALIAS: ${{ secrets.TOK_ANDROID_KEY_ALIAS }}
          TOK_ANDROID_KEY_PASSWORD: ${{ secrets.TOK_ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon -p android assembleRelease
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TOK-Android.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TOK-Android
          path: TOK-Android.apk
          retention-days: 30
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(grep -o 'versionName "[^"]*"' android/app/build.gradle | head -1 | cut -d '"' -f2)
          TAG="android-v${VERSION_NAME}"
          gh release create "$TAG" TOK-Android.apk \
            --title "ТОК Android v${VERSION_NAME}" \
            --notes "Исправления в этом релизе:\n- Исправлено наложение интерфейса на системные панели Android 15+: WebView учитывает системные отступы и вырез экрана при edge-to-edge.\n- Исправлено постоянное уведомление об обновлении: используется фактическая версия APK и показываются только более новые релизы.\n- Отложенное обновление не повторяется при каждом открытии, пока не выйдет следующая версия.\n- При открытии клавиатуры нижняя навигация скрывается, а поле ввода поднимается над клавиатурой и учитывает изменение видимой области WebView.\n- Область сообщений прокручивается отдельно, без сдвига поля ввода.\n- APK подписан постоянным ключом, чтобы следующие версии устанавливались поверх предыдущих.\n- Сохранены исправления логотипа, подтверждения почты и размещения удаления аккаунта в редактировании профиля." \
            --latest

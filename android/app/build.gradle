plugins {
    id "com.android.application"
}

android {
    namespace "ru.tok.ispu"
    compileSdk 35

    defaultConfig {
        applicationId "ru.tok.ispu"
        minSdk 23
        targetSdk 35
        versionCode 8
        versionName "1.7"
    }

    // Release versionCode/versionName are set from the GitHub Actions run number.
    // The CI build uses a persistent private key supplied through GitHub Actions
    // secrets, so users can install future APKs over the previous version.
    // CI may also publish a temporary debug-signed prerelease if signing secrets are absent.
    signingConfigs {
        release {
            storeFile file("tok-release.jks")
            storePassword System.getenv("TOK_ANDROID_KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("TOK_ANDROID_KEY_ALIAS") ?: "tok-release"
            keyPassword System.getenv("TOK_ANDROID_KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity:1.10.1"
    implementation "androidx.core:core:1.16.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
}